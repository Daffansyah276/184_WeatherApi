<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Geolocation API - Pixel Quest</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
          rel="stylesheet">


    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
        ================================================== */

        body {

            min-height: 100vh;

            font-family: 'VT323', monospace;

            color: #ffffff;

            padding: 30px 20px;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #17213a 0%,
                    #0b1020 45%,
                    #05070f 100%
                );

            position: relative;
        }


        /* ==================================================
           PIXEL GRID BACKGROUND
        ================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:

                linear-gradient(
                    rgba(0, 255, 157, 0.04) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 255, 157, 0.04) 1px,
                    transparent 1px
                );

            background-size: 20px 20px;

            z-index: -3;
        }


        /* ==================================================
           SCANLINE EFFECT
        ================================================== */

        body::after {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:

                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.025),
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 4px
                );

            z-index: 999;

            opacity: 0.6;
        }


        /* ==================================================
           MAIN CONTAINER
        ================================================== */

        body > * {

            max-width: 500px;

            margin-left: auto;
            margin-right: auto;
        }


        /* ==================================================
           PLAYER INFO
        ================================================== */

        h3 {

            font-family: 'Press Start 2P', monospace;

            font-size: 11px;

            line-height: 1.8;

            color: #00ff9d;

            background: #101728;

            border: 4px solid #00ff9d;

            padding: 14px 18px;

            margin-bottom: 10px;

            box-shadow:

                6px 6px 0 #02040a,

                0 0 20px
                rgba(0,255,157,0.25);

            text-shadow:
                2px 2px 0 #000;
        }

        hr {

            border: none;

            height: 5px;

            margin: 28px auto;

            background:

                repeating-linear-gradient(
                    90deg,

                    #00ff9d 0px,
                    #00ff9d 14px,

                    transparent 14px,
                    transparent 20px
                );

            box-shadow:
                0 0 10px rgba(0,255,157,0.6);
        }


        /* ==================================================
           SEARCH PANEL
        ================================================== */

        body > div {

            background: #111827;

            border: 4px solid #ffd93d;

            padding: 28px;

            position: relative;

            box-shadow:

                8px 8px 0 #02040a,

                0 0 30px
                rgba(255,217,61,0.15);
        }


        /* ==================================================
           SEARCH PANEL HEADER
        ================================================== */

        body > div::before {

            content: "★ LOCATION SEARCH ★";

            display: block;

            font-family:
                'Press Start 2P',
                monospace;

            font-size: 12px;

            color: #ffd93d;

            text-align: center;

            margin-bottom: 25px;

            text-shadow:
                2px 2px 0 #000,

                0 0 10px
                rgba(255,217,61,0.7);
        }


        /* ==================================================
           LABEL
        ================================================== */

        label {

            display: block;

            font-family:
                'Press Start 2P',
                monospace;

            font-size: 10px;

            color: #ffffff;

            margin-bottom: 12px;

            text-shadow:
                2px 2px 0 #000;
        }


        /* ==================================================
           INPUT
        ================================================== */

        input[type="text"] {

            width: calc(100% - 120px);

            padding: 15px;

            font-family:
                'VT323',
                monospace;

            font-size: 23px;

            color: #00ff9d;

            background: #050810;

            border: 4px solid #00ff9d;

            outline: none;

            box-shadow:

                inset 4px 4px 0 #020308,

                0 0 10px
                rgba(0,255,157,0.2);

            transition: 0.2s;
        }


        input[type="text"]:focus {

            border-color: #00e5ff;

            color: #00e5ff;

            box-shadow:

                inset 4px 4px 0 #020308,

                0 0 20px
                rgba(0,229,255,0.5);
        }


        input::placeholder {

            color: #666b78;
        }


        /* ==================================================
           BUTTON
        ================================================== */

        button {

            width: 105px;

            padding: 16px 8px;

            margin-left: 8px;

            font-family:
                'Press Start 2P',
                monospace;

            font-size: 9px;

            color: #111;

            background: #ff4d6d;

            border: 4px solid #ffffff;

            cursor: pointer;

            box-shadow:
                6px 6px 0 #02040a;

            transition: 0.15s;

            vertical-align: top;
        }


        button:hover {

            background: #ff7590;

            transform:
                translate(2px, 2px);

            box-shadow:
                4px 4px 0 #02040a;
        }


        button:active {

            transform:
                translate(6px, 6px);

            box-shadow: none;
        }


        /* ==================================================
           LOCATION DATA
        ================================================== */

        p {

            max-width: 500px;

            margin: 14px auto;

            padding: 17px 20px;

            background: #111827;

            border-left: 7px solid #00e5ff;

            font-size: 23px;

            box-shadow:
                6px 6px 0 #02040a;

            transition: 0.2s;
        }


        p:hover {

            transform:
                translateX(4px);

            box-shadow:
                3px 6px 0 #02040a;
        }


        /* ==================================================
           DATA ICON
        ================================================== */

        p::before {

            content: "▶ ";

            color: #00e5ff;

            font-size: 16px;
        }


        /* ==================================================
           DATA VALUE
        ================================================== */

        p span {

            float: right;

            min-width: 180px;

            text-align: right;

            font-family:
                'Press Start 2P',
                monospace;

            font-size: 9px;

            color: #ffd93d;

            text-shadow:
                0 0 8px
                rgba(255,217,61,0.7);
        }


        /* ==================================================
           COUNTRY
        ================================================== */

        p:nth-of-type(1) {

            border-left-color: #ff4d6d;
        }

        p:nth-of-type(1) span {

            color: #ff4d6d;
        }


        /* ==================================================
           PROVINCE
        ================================================== */

        p:nth-of-type(2) {

            border-left-color: #c77dff;
        }

        p:nth-of-type(2) span {

            color: #c77dff;
        }


        /* ==================================================
           CITY
        ================================================== */

        p:nth-of-type(3) {

            border-left-color: #00ff9d;
        }

        p:nth-of-type(3) span {

            color: #00ff9d;
        }


        /* ==================================================
           LONGITUDE
        ================================================== */

        p:nth-of-type(4) {

            border-left-color: #00e5ff;
        }

        p:nth-of-type(4) span {

            color: #00e5ff;
        }


        /* ==================================================
           LATITUDE
        ================================================== */

        p:nth-of-type(5) {

            border-left-color: #ffd93d;
        }

        p:nth-of-type(5) span {

            color: #ffd93d;
        }


        /* ==================================================
           RESPONSIVE MOBILE
        ================================================== */

        @media (max-width: 500px) {

            body {

                padding:
                    20px 12px;
            }


            h3 {

                font-size: 8px;

                padding: 11px;
            }


            body > div {

                padding: 20px;
            }


            input[type="text"] {

                width: 100%;

                margin-bottom: 12px;
            }


            button {

                width: 100%;

                margin-left: 0;
            }


            p {

                font-size: 20px;

                padding: 14px;
            }


            p span {

                display: block;

                float: none;

                min-width: auto;

                text-align: left;

                margin-top: 8px;

                font-size: 8px;
            }

        }

    </style>

</head>
